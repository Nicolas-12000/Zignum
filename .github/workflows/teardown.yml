name: Stop Dev Environment

on:
  workflow_dispatch:  # Solo se ejecuta manualmente desde GitHub

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop RDS instance
        run: |
          aws rds stop-db-instance \
            --db-instance-identifier zignum-db \
            --region ${{ secrets.AWS_REGION }}
          echo "✅ RDS detenida. Se reiniciará automáticamente en 7 días."
          echo "⚠️ Para evitar que se reinicie, deténla de nuevo antes de 7 días."