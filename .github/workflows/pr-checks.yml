name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install flake8 --quiet

      - name: Lint Lambda code
        run: |
          flake8 lambdas/ --max-line-length=100 --exclude=lambdas/*/package/